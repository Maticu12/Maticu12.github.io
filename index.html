<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0610">
<meta name="description" content="점점 빨라지는 용암을 피해 끝없이 올라가는 도트 등반 게임">
<title>라바 클라임</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
@font-face{font-family:"Silkscreen";font-weight:400;font-display:swap;src:url(fonts/silkscreen-400.woff2) format("woff2")}
@font-face{font-family:"Silkscreen";font-weight:700;font-display:swap;src:url(fonts/silkscreen-700.woff2) format("woff2")}
@font-face{font-family:"Do Hyeon";font-weight:400;font-display:swap;src:url(fonts/dohyeon-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+2190-21FF,U+25A0-25FF}
@font-face{font-family:"Do Hyeon";font-weight:400;font-display:swap;src:url(fonts/dohyeon-korean.woff2) format("woff2");unicode-range:U+1100-11FF,U+3130-318F,U+AC00-D7AF,U+3000-303F,U+FF00-FFEF}

/* Layout: one pixel stage (144 px wide, 5 lanes, height follows the screen) centered in a dark void; every UI size scales from --u = 1% of stage width. */
:root{
  --void:#0b0610;
  --panel:#231420;
  --edge:#4a2a36;
  --ink:#fff1dc;
  --dim:#c9a99a;
  --ember:#ff7a1a;
  --lava:#ff3b1f;
  --gold:#ffd84a;
  --f-pixel:"Silkscreen","Courier New",monospace;
  --f-kr:"Do Hyeon","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --u:3.6px;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--ink);font-family:var(--f-kr);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
#app{height:100%;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse 70% 40% at 50% 110%,rgba(255,70,20,.22),transparent 70%),var(--void)}
#stage{position:relative;overflow:hidden;background:#000;touch-action:none;box-shadow:0 0 0 2px #000,0 0 80px rgba(255,70,20,.12)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:crisp-edges;image-rendering:pixelated}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}

/* ---------- HUD ---------- */
.hud{position:absolute;inset:0;pointer-events:none}
.px-out{text-shadow:calc(var(--u)*-.6) 0 0 #000,calc(var(--u)*.6) 0 0 #000,0 calc(var(--u)*-.6) 0 #000,0 calc(var(--u)*.6) 0 #000,0 calc(var(--u)*1.3) 0 #000}
.hud-h{position:absolute;left:0;right:0;top:calc(var(--u)*3.4);display:flex;flex-direction:column;align-items:center;font-family:var(--f-pixel);font-weight:700;line-height:1}
#hH{font-size:calc(var(--u)*11);font-variant-numeric:tabular-nums;display:inline-block}
#hH.bump{animation:bump .12s steps(2)}
@keyframes bump{50%{transform:translateY(calc(var(--u)*-1))}}
.hud-best{font-size:calc(var(--u)*3.2);color:var(--dim);margin-top:calc(var(--u)*1.2);font-weight:400}
.lava-row{display:flex;align-items:center;gap:calc(var(--u)*1.6);margin-top:calc(var(--u)*1.6);font-size:calc(var(--u)*3);font-weight:400}
.lava-row .lbl{color:var(--ember)}
.meter{position:relative;width:calc(var(--u)*26);height:calc(var(--u)*2.2);background:rgba(10,4,8,.7);box-shadow:0 0 0 calc(var(--u)*.6) #000}
.meter i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(to right,var(--lava),var(--ember) 70%,var(--gold))}
.meter.hot{animation:hot .3s steps(2) infinite}
@keyframes hot{50%{box-shadow:0 0 0 calc(var(--u)*.6) var(--lava)}}
#meterNum{min-width:calc(var(--u)*5);font-weight:700;font-variant-numeric:tabular-nums}
.hud-coins{position:absolute;left:calc(var(--u)*4);top:calc(var(--u)*5);display:flex;align-items:center;gap:calc(var(--u)*1.6);font-family:var(--f-pixel);font-weight:700;font-size:calc(var(--u)*4.4)}
.coin-ico{display:inline-block;flex:none;width:calc(var(--u)*3.4);height:calc(var(--u)*3.4);background:var(--gold);box-shadow:inset calc(var(--u)*-.7) calc(var(--u)*-.7) 0 #c08a10,0 0 0 calc(var(--u)*.6) #3a2004}
#btnPause{position:absolute;right:calc(var(--u)*4);top:calc(var(--u)*4);width:calc(var(--u)*10);height:calc(var(--u)*10);border:0;padding:0;background:rgba(20,10,18,.7);box-shadow:0 0 0 calc(var(--u)*.6) #000;pointer-events:auto;display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*1.4)}
#btnPause i{display:block;width:calc(var(--u)*1.6);height:calc(var(--u)*4.4);background:var(--ink)}
#btnPause:focus-visible,.btn:focus-visible,.skin:focus-visible,.tog:focus-visible{outline:calc(var(--u)*.8) solid var(--gold);outline-offset:calc(var(--u)*.6)}

.zone{position:absolute;left:50%;top:calc(var(--u)*27);transform:translate(-50%,calc(var(--u)*-2));display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*.6);opacity:0;pointer-events:none;white-space:nowrap}
.zone.show{animation:zone 2s ease-out forwards}
.zone.show.tip{animation-duration:2.6s}
@keyframes zone{0%{opacity:0;transform:translate(-50%,calc(var(--u)*-2))}8%{opacity:1;transform:translate(-50%,0)}80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,0)}}
.z-name{display:flex;align-items:baseline;gap:calc(var(--u)*1.6);font-size:calc(var(--u)*5.2);background:rgba(10,4,8,.55);padding:calc(var(--u)*.8) calc(var(--u)*3) calc(var(--u)*1.1);box-shadow:0 0 0 calc(var(--u)*.5) rgba(0,0,0,.6)}
.z-no{font-family:var(--f-pixel);font-weight:700;font-size:calc(var(--u)*3.4);color:var(--ember)}
.z-tip{font-size:calc(var(--u)*3.8);color:var(--gold)}
#hH.fire{color:var(--gold);text-shadow:calc(var(--u)*-.6) 0 0 #000,calc(var(--u)*.6) 0 0 #000,0 calc(var(--u)*-.6) 0 #000,0 calc(var(--u)*.6) 0 #000,0 calc(var(--u)*1.3) 0 #000,0 0 calc(var(--u)*3) rgba(255,122,26,.9)}
.pads{position:absolute;left:0;right:0;bottom:0;display:flex;gap:calc(var(--u)*2.4);padding:0 calc(var(--u)*2.4) calc(var(--u)*2.4)}
.pad{flex:1;height:calc(var(--u)*16);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*.8);background:rgba(24,12,20,.55);box-shadow:inset 0 calc(var(--u)*-1.2) 0 rgba(0,0,0,.45),0 0 0 calc(var(--u)*.7) rgba(0,0,0,.85)}
.pad svg{width:calc(var(--u)*7);height:calc(var(--u)*7);fill:var(--ink)}
.pad span{font-size:calc(var(--u)*3.6)}
.pad.down{transform:translateY(calc(var(--u)*.8));background:rgba(255,122,26,.6);box-shadow:inset 0 calc(var(--u)*1) 0 rgba(0,0,0,.3),0 0 0 calc(var(--u)*.7) #000}
.pad.hint{animation:hint .5s steps(2) infinite}
@keyframes hint{50%{box-shadow:inset 0 calc(var(--u)*-1.2) 0 rgba(0,0,0,.45),0 0 0 calc(var(--u)*1) var(--gold)}}
.tut{position:absolute;left:0;right:0;bottom:calc(var(--u)*21);text-align:center;font-size:calc(var(--u)*4.2);color:var(--gold)}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;box-sizing:border-box;padding:calc(var(--u)*8) calc(var(--u)*6)}
.screen.dim{background:rgba(8,3,8,.66);justify-content:center}
.title{background:linear-gradient(to bottom,rgba(11,6,16,.65) 0,rgba(11,6,16,0) 36%,rgba(11,6,16,0) 56%,rgba(11,6,16,.72) 100%)}
.logo{margin-top:calc(var(--u)*9);text-align:center}
.logo-en{font-family:var(--f-pixel);font-weight:700;line-height:.92;font-size:calc(var(--u)*16.5)}
.l-lava{display:block;color:var(--ember);text-shadow:0 calc(var(--u)*-1) 0 var(--gold),calc(var(--u)*1.2) calc(var(--u)*1.4) 0 #5a0d06}
.l-climb{display:block;color:var(--ink);text-shadow:calc(var(--u)*1.2) calc(var(--u)*1.4) 0 #000}
.logo-kr{margin-top:calc(var(--u)*3.4);font-size:calc(var(--u)*5.2);color:var(--ink)}
.title-foot{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*4);width:100%}
.tap{font-size:calc(var(--u)*6.4);color:var(--gold);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.stats{display:flex;gap:calc(var(--u)*7);font-family:var(--f-pixel);font-size:calc(var(--u)*4.4);align-items:center}
.stats > div{display:flex;align-items:center;gap:calc(var(--u)*1.8)}
.stats .lbl{color:var(--dim);font-size:calc(var(--u)*3.2)}
.row{display:flex;gap:calc(var(--u)*3);justify-content:center}
.howto{font-size:calc(var(--u)*3.6);color:var(--dim);text-align:center;line-height:1.45}
.btn{font-family:var(--f-kr);font-size:calc(var(--u)*5);border:0;background:var(--panel);color:var(--ink);padding:calc(var(--u)*2.4) calc(var(--u)*5.5) calc(var(--u)*3);box-shadow:inset 0 calc(var(--u)*-1.2) 0 rgba(0,0,0,.4),0 0 0 calc(var(--u)*.8) #000}
.btn.primary{background:var(--ember);color:#2a0a04}
.btn:active{transform:translateY(calc(var(--u)*.6));box-shadow:inset 0 calc(var(--u)*.8) 0 rgba(0,0,0,.3),0 0 0 calc(var(--u)*.8) #000}
.btn:disabled{opacity:.5}
.card{background:var(--panel);box-shadow:0 0 0 calc(var(--u)*.8) #000,0 0 0 calc(var(--u)*1.6) var(--edge),calc(var(--u)*1.6) calc(var(--u)*2.2) 0 calc(var(--u)*1.6) rgba(0,0,0,.55);padding:calc(var(--u)*6);width:100%;max-width:calc(var(--u)*84);box-sizing:border-box;display:flex;flex-direction:column;gap:calc(var(--u)*4)}
.card-head{display:flex;justify-content:space-between;align-items:center;font-size:calc(var(--u)*7)}
.over-head{font-size:calc(var(--u)*7);color:var(--lava);text-align:center}
.over-h{text-align:center;line-height:1}
.over-h b{font-family:var(--f-pixel);font-weight:700;font-size:calc(var(--u)*20);font-variant-numeric:tabular-nums}
.over-h span{font-size:calc(var(--u)*6);color:var(--dim);margin-left:calc(var(--u)*1.2)}
.newbest{align-self:center;font-family:var(--f-pixel);font-weight:700;font-size:calc(var(--u)*3.8);background:var(--gold);color:#3a2004;padding:calc(var(--u)*1) calc(var(--u)*2.4);animation:blink .6s steps(2) infinite}
.ostats{margin:0;display:grid;grid-template-columns:1fr auto;gap:calc(var(--u)*2) calc(var(--u)*4);font-size:calc(var(--u)*4.6)}
.ostats dt{color:var(--dim)}
.ostats dd{margin:0;text-align:right;font-family:var(--f-pixel);font-variant-numeric:tabular-nums}
.ostats dd.kr{font-family:var(--f-kr)}
.coin-pill{display:flex;align-items:center;gap:calc(var(--u)*1.6);font-family:var(--f-pixel);font-size:calc(var(--u)*4.4)}
.skin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--u)*3)}
.skin{border:0;background:#160c14;box-shadow:0 0 0 calc(var(--u)*.6) #000;padding:calc(var(--u)*2.4) calc(var(--u)*1) calc(var(--u)*2);display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*1.4);min-width:0}
.skin canvas{width:calc(var(--u)*10);height:calc(var(--u)*14);image-rendering:pixelated}
.skin.locked canvas{filter:brightness(0) opacity(.55)}
.skin.sel{background:#3a1c18;box-shadow:0 0 0 calc(var(--u)*.6) #000,0 0 0 calc(var(--u)*1.2) var(--ember)}
.skin-name{font-size:calc(var(--u)*4)}
.skin-state{font-size:calc(var(--u)*3.2);color:var(--dim)}
.skin.sel .skin-state{color:var(--ember)}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:calc(var(--u)*3);font-size:calc(var(--u)*5)}
.tog{border:0;background:#160c14;font-size:calc(var(--u)*4.2);padding:calc(var(--u)*1.6) calc(var(--u)*3);min-width:calc(var(--u)*15);box-shadow:0 0 0 calc(var(--u)*.6) #000}
.tog[aria-pressed="true"]{background:var(--ember);color:#2a0a04}
.set-note{margin:0;font-size:calc(var(--u)*3.8);color:var(--dim);line-height:1.45}
@media (prefers-reduced-motion:reduce){.zone.show{animation:fade 2s linear forwards}@keyframes fade{0%,85%{opacity:1}100%{opacity:0}}.tap,.newbest,.pad.hint,.meter.hot{animation:none}}
#app{box-sizing:border-box;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv" width="144" height="256" aria-label="게임 화면"></canvas>

    <div class="hud" id="hud" hidden>
      <div class="hud-coins px-out"><i class="coin-ico"></i><span id="hCoins">0</span></div>
      <div class="hud-h px-out">
        <span id="hH">0</span>
        <div class="hud-best">BEST <span id="hBest">0</span></div>
        <div class="lava-row"><span class="lbl">LAVA</span><div class="meter" id="meter"><i id="meterFill"></i></div><span id="meterNum">5</span></div>
      </div>
      <button id="btnPause" aria-label="일시정지"><i></i><i></i></button>
      <div class="zone" id="zone" aria-live="polite"><div class="z-name px-out"><span class="z-no" id="zNo">2</span><span id="zKr">무너진 유적</span></div><div class="z-tip px-out" id="zTip" hidden></div></div>
      <div class="tut px-out" id="tut" hidden>깜빡이는 버튼 쪽 발판으로 올라가세요</div>
      <div class="pads">
        <div class="pad" id="pad0"><svg viewBox="0 0 12 12" aria-hidden="true"><rect x="1" y="1" width="6" height="2"/><rect x="1" y="1" width="2" height="6"/><rect x="3" y="3" width="2" height="2"/><rect x="5" y="5" width="2" height="2"/><rect x="7" y="7" width="2" height="2"/><rect x="9" y="9" width="2" height="2"/></svg><span>왼쪽 위</span></div>
        <div class="pad" id="pad1"><svg viewBox="0 0 12 12" aria-hidden="true"><rect x="5" y="1" width="2" height="10"/><rect x="3" y="3" width="2" height="2"/><rect x="7" y="3" width="2" height="2"/><rect x="1" y="5" width="2" height="2"/><rect x="9" y="5" width="2" height="2"/></svg><span>위</span></div>
        <div class="pad" id="pad2"><svg viewBox="0 0 12 12" aria-hidden="true"><rect x="5" y="1" width="6" height="2"/><rect x="9" y="1" width="2" height="6"/><rect x="7" y="3" width="2" height="2"/><rect x="5" y="5" width="2" height="2"/><rect x="3" y="7" width="2" height="2"/><rect x="1" y="9" width="2" height="2"/></svg><span>오른쪽 위</span></div>
      </div>
    </div>

    <div class="screen title" id="scrTitle">
      <div class="logo">
        <div class="logo-en"><span class="l-lava">LAVA</span><span class="l-climb">CLIMB</span></div>
        <div class="logo-kr px-out">용암을 피해 끝없이 올라라</div>
      </div>
      <div class="title-foot">
        <div class="tap px-out">탭해서 시작</div>
        <div class="stats px-out"><div><span class="lbl">BEST</span><b id="tBest">0</b></div><div><i class="coin-ico"></i><b id="tCoins">0</b></div></div>
        <div class="row"><button class="btn" id="btnSkins">캐릭터</button><button class="btn" id="btnSet">설정</button></div>
        <div class="howto px-out">화면 왼쪽 · 가운데 · 오른쪽 = 왼쪽 위 · 위 · 오른쪽 위<br>PC: ← ↑ → 또는 A W D</div>
      </div>
    </div>

    <div class="screen dim" id="scrPause" hidden>
      <div class="card">
        <div class="over-head" style="color:var(--ink)">일시정지</div>
        <button class="btn primary" id="btnResume">계속하기</button>
        <button class="btn" id="btnQuit">그만하기</button>
      </div>
    </div>

    <div class="screen dim" id="scrOver" hidden>
      <div class="card">
        <div class="over-head">용암에 삼켜졌다</div>
        <div class="over-h"><b id="oH">0</b><span>층</span></div>
        <div class="newbest" id="oNew" hidden>NEW BEST</div>
        <dl class="ostats">
          <dt>최고 기록</dt><dd id="oBest">0</dd>
          <dt>도달 구역</dt><dd class="kr" id="oZone">용암 동굴</dd>
          <dt>획득 코인</dt><dd id="oCoins">0</dd>
          <dt>추락 횟수</dt><dd id="oFalls">0</dd>
        </dl>
        <div class="row"><button class="btn primary" id="btnRetry">다시 오르기</button><button class="btn" id="btnMenu">메뉴</button></div>
      </div>
    </div>

    <div class="screen dim" id="scrSkins" hidden>
      <div class="card">
        <div class="card-head"><span>캐릭터</span><span class="coin-pill"><i class="coin-ico"></i><b id="sCoins">0</b></span></div>
        <div class="skin-grid" id="skinGrid"></div>
        <button class="btn" id="btnSkinsBack">닫기</button>
      </div>
    </div>

    <div class="screen dim" id="scrSet" hidden>
      <div class="card">
        <div class="card-head"><span>설정</span></div>
        <div class="set-row"><span>효과음</span><button class="tog" id="tSfx"></button></div>
        <div class="set-row"><span>배경음악</span><button class="tog" id="tMusic"></button></div>
        <div class="set-row"><span>진동</span><button class="tog" id="tVib"></button></div>
        <p class="set-note">구역 순서는 판마다 바뀝니다. 첫 구역만 항상 용암 동굴이에요.</p>
        <button class="btn" id="btnSetBack">닫기</button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const app = $('app'), stage = $('stage'), cv = $('cv'), ctx = cv.getContext('2d');
const dark = document.createElement('canvas'), dctx = dark.getContext('2d');
const W = 144, LANES = 5, LW = 28, LX0 = 2, DY = 18, ZLEN = 50, BW = 24;
let H = 256;
const RM = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

/* ================= save ================= */
const KEY = 'lavaclimb.save.v2';
const save = {best:0, coins:0, owned:['climber'], skin:'climber', sfx:true, music:true, vib:true, tut:false, seen:[]};
try { const raw = localStorage.getItem(KEY); if (raw) Object.assign(save, JSON.parse(raw)); } catch (e) {}
function persist(){ try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} }

/* ================= utils ================= */
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const lerp = (a,b,t) => a+(b-a)*t;
const rnd = (a,b) => a+Math.random()*(b-a);
const pick = a => a[Math.floor(Math.random()*a.length)];
function hash(a,b){ let h=(Math.imul(a|0,374761393)+Math.imul(b|0,668265263))|0; h=Math.imul(h^(h>>>13),1274126177); h^=h>>>16; return (h>>>0)/4294967296; }
const RGBC = {};
const rgb = h => RGBC[h] || (RGBC[h] = [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]);
const mixA = (a,b,t) => [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];
const css = a => 'rgb('+(a[0]|0)+','+(a[1]|0)+','+(a[2]|0)+')';
const mixc = (a,b,t) => css(mixA(rgb(a),rgb(b),t));
function R(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(x,y,w,h); }
function circ(g,cx,cy,r,c){ if(c) g.fillStyle=c; for(let y=-r;y<=r;y++){ const w=Math.floor(Math.sqrt(Math.max(0,r*r-y*y+r*.8))); g.fillRect(cx-w,cy+y,w*2+1,1); } }
const smooth = t => t*t*(3-2*t);
const laneX = l => LX0 + l*LW + LW/2;
const rowY = r => -r*DY;

function buildSprite(rows,pal){ const c=document.createElement('canvas'); c.width=10; c.height=14; const g=c.getContext('2d'); rows.forEach((r,y)=>{ for(let x=0;x<r.length;x++){ const ch=r[x]; if(ch==='.') continue; g.fillStyle=pal[ch]; g.fillRect(x,y,1,1); } }); return c; }
function mirror(src){ const c=document.createElement('canvas'); c.width=src.width; c.height=src.height; const g=c.getContext('2d'); g.translate(src.width,0); g.scale(-1,1); g.drawImage(src,0,0); return c; }

/* ================= generator: 5 lanes, one guaranteed path + decoys ================= */
const PH_PER=2.0, PH_ON=1.3, PH_WARN=0.4, CRUMBLE_T=0.7;
let run = null;
function mkCell(t,coinP){ return {t, broken:false, until:0, coin:t!=='spike' && t!=='floor' && Math.random()<(coinP||0), got:false, v:Math.random(), sq:0, ph:Math.random()*PH_PER, deco:(t==='normal'&&Math.random()<.18)?Math.floor(Math.random()*3):-1}; }
function newRun(){
  const rest=[1,2,3,4,5,6];
  for(let i=rest.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [rest[i],rest[j]]=[rest[j],rest[i]]; }
  run = {order:[0,...rest], rows:[], forced:{}, safe:[2]};
}
function zoneTheme(z){ return run.order[((z%7)+7)%7]; }
function themeAt(r){ return zoneTheme(Math.floor(Math.max(0,r)/ZLEN)); }
function zoneName(z){ return THEMES[zoneTheme(z)].kr + (z>=7 ? ' '+ROMAN[Math.min(9,Math.floor(z/7))] : ''); }
function zoneMech(z){
  const m=THEMES[zoneTheme(z)].mech.slice();
  if(z>=7){ for(const x of THEMES[zoneTheme(z+2)].mech) if(!m.includes(x)) m.push(x); }
  return m;
}
function reach(s,w){ const out=new Set(); for(const d of [-1,0,1]) out.add(clamp(s+d+w,0,LANES-1)); return out; }
function genRow(r){
  const z=Math.floor(r/ZLEN), th=zoneTheme(z), pos=r-z*ZLEN, d=Math.min(1,r/350);
  const row={r, z, th, cells:new Array(LANES).fill(null), wind:0, mov:null, path:[], decor:false};
  if(r===0){ for(let i=0;i<LANES;i++) row.cells[i]=mkCell('floor'); run.safe=[2]; row.path=[0,1,2,3,4]; return row; }
  const spikeP = r<10 ? 0 : .12+.35*d;
  const decoyP = r<6 ? .55 : .6-.3*d;
  const decoy = () => { const x=Math.random(); if(x<spikeP) return mkCell('spike'); if(r>15 && x<spikeP+.15) return mkCell('crumble',.08); return mkCell('normal',.14); };
  const f=run.forced[r];
  if(f && f.decor){ for(let i=0;i<LANES;i++) if(Math.random()<.5) row.cells[i]=decoy(); row.decor=true; return row; }
  if(f && f.lane!=null){
    row.cells[f.lane]=mkCell('normal',.3);
    for(let i=0;i<LANES;i++) if(i!==f.lane && Math.random()<decoyP) row.cells[i]=decoy();
    run.safe=[f.lane]; row.path=[f.lane]; return row;
  }
  const mechs=zoneMech(z);
  let m=null;
  if(pos>=3 && r>=4 && mechs.length && Math.random()<.5+.2*d) m=pick(mechs);
  if(m==='wind') row.wind=Math.random()<.5?-1:1;
  let cand=null;
  for(const s of run.safe){ const rs=reach(s,row.wind); cand=cand?new Set([...cand].filter(x=>rs.has(x))):rs; }
  let list=[...cand]; if(!list.length) list=[...reach(run.safe[0],row.wind)];
  const T=pick(list);
  let ns=[T];
  if(m==='ice'){ ns=[]; for(let l=T-1;l<=T+1;l++) if(l>=0&&l<LANES){ row.cells[l]=mkCell('ice',.05); ns.push(l); } }
  else if(m==='crumble') row.cells[T]=mkCell('crumble',.05);
  else if(m==='phase') row.cells[T]=mkCell('phase',.05);
  else if(m==='moving'){
    const p2=(T+1<LANES && (T<1 || Math.random()<.5)) ? T+1 : T-1;
    row.mov={a:T,b:p2,period:1.5-.4*d+Math.random()*.4,ph:Math.random()*Math.PI*2};
    ns=[T,p2];
  }
  else if(m==='spring'){ row.cells[T]=mkCell('spring'); run.forced[r+1]={decor:true}; run.forced[r+2]={decor:true}; run.forced[r+3]={lane:T}; }
  else row.cells[T]=mkCell('normal',.05);
  for(let i=0;i<LANES;i++){
    if(row.cells[i]) continue;
    if(row.mov && (i===row.mov.a||i===row.mov.b)) continue;
    if(Math.random()<decoyP) row.cells[i]=decoy();
  }
  run.safe=ns; row.path=ns.slice();
  return row;
}
function getRow(r){ while(run.rows.length<=r) run.rows.push(genRow(run.rows.length)); return run.rows[r]; }
function movPos(row,t){ const m=row.mov; const f=.5-.5*Math.cos(2*Math.PI*(t/m.period)+m.ph); return m.a+(m.b-m.a)*f; }
function phaseOn(c){ return (gt+c.ph)%PH_PER<PH_ON; }
function phaseWarn(c){ const u=(gt+c.ph)%PH_PER; return u<PH_ON && u>PH_ON-PH_WARN; }
// what can be stood on at (row, lane)? null = nothing. t===null: a moving platform counts at either end.
function landType(row,lane,t){
  if(!row) return null;
  if(row.mov){
    if(t==null){ if(lane===row.mov.a||lane===row.mov.b) return 'moving'; }
    else if(Math.abs(movPos(row,t)-lane)<=.55) return 'moving';
  }
  const c=row.cells[lane];
  if(!c||c.broken) return null;
  if(c.t==='phase' && !phaseOn(c)) return null;
  return c.t;
}

/* ================= state ================= */
let state='title', paused=false, started=false;
let L=-5, lavaSpeed=0, runT=0, gt=0;
let camY=0, viewY=0, shakeT=0, shakeA=0;
let maxRow=0, maxZone=0, coinsRun=0, falls=0, deadT=0, overShown=false;
let parts=[], flash=0, nextBolt=3, boltX=0, boltSeed=0;
// fire streak: quick consecutive climbs set the climber alight
const FIRE_GAP=0.34, FIRE_ON=6, FIRE_HOT=20;
let streak=0, lastHop=-9, fire=0, fireLvl=0;
function breakStreak(){ streak=0; }
const p = {};

function resetWorld(){
  newRun(); getRow(60);
  Object.assign(p,{row:0,lane:2,dir:1,state:'idle',x:laneX(2),y:0,anim:null,vy:0,fallLane:2,checkRow:0,fromRow:0,stunT:0,launchAt:0,riding:null});
  L=-5; lavaSpeed=0; runT=0; maxRow=0; maxZone=0; coinsRun=0; falls=0; deadT=0; overShown=false;
  parts.length=0; started=false; flash=0; nextBolt=3; streak=0; lastHop=-9; fire=0; fireLvl=0;
  camY=p.y-H*.64;
}

/* ================= player ================= */
function anim(tx,ty,dur,arc){ p.anim={fx:p.x,fy:p.y,tx,ty,t:0,dur,arc}; }
function act(dx){
  if(state!=='play'||paused) return;
  if(p.state==='hop') finishHop();
  if(p.state!=='idle') return;
  started=true;
  if(dx) p.dir=dx;
  const nr=p.row+1, row=getRow(nr);
  getRow(nr+60);
  const lane=clamp(p.lane+dx+row.wind,0,LANES-1);
  const ty=landType(row,lane,gt);
  if(!ty){ sfx('miss'); startFall(lane,false,false); return; }
  p.riding=null;
  p.row=nr; p.lane=lane; p.state='hop';
  anim(ty==='moving' ? laneX(movPos(row,gt)) : laneX(lane), rowY(nr), .08, 4);
  if(ty==='spike'){ knock(); return; }
  streak = (gt-lastHop<FIRE_GAP) ? streak+1 : 1; lastHop=gt;
  sfx('step');
  arrive(nr,lane,ty,dx);
}
function finishHop(){ if(p.anim){ p.x=p.anim.tx; p.y=p.anim.ty; p.anim=null; } if(p.state==='hop') p.state='idle'; }
function arrive(r,lane,ty,dx){
  const row=getRow(r);
  if(ty==='ice' && dx){
    const dest=lane+dx;
    if(dest>=0 && dest<LANES && landType(row,dest,null)==='ice'){ p.lane=lane=dest; anim(laneX(dest),rowY(r),.13,3); sfx('ice'); }
  }
  p.riding = ty==='moving' ? row : null;
  if(r>maxRow){
    maxRow=r;
    const z=Math.floor(r/ZLEN);
    if(z>maxZone){ maxZone=z; coinsRun+=5; showZone(z); sfx('zone'); }
  }
  const c=row.cells[lane];
  if(c && ty!=='moving'){
    if(c.coin && !c.got){ c.got=true; coinsRun++; sfx('coin'); puff(laneX(lane),rowY(r)-10,6,'#ffd84a',35,40,.35); }
    if(c.t==='crumble' && !c.until) c.until=gt+CRUMBLE_T;
    if(c.t==='spring'){ c.sq=.35; p.state='launch'; p.launchAt=gt+.13; sfx('spring'); vib(20); return; }
  }
  puff(p.anim?p.anim.tx:p.x,rowY(r),2,THEMES[row.th].blk.t,14,30,.25);
}
function doLaunch(){ p.state='spring'; anim(laneX(p.lane),rowY(p.row+3),.34,30); }
function landSpring(){
  const r=p.row+3, row=getRow(r), ty=landType(row,p.lane,gt);
  p.row=r; p.state='idle';
  if(!ty){ startFall(p.lane,false,true); return; }
  if(ty==='spike'){ knock(); return; }
  if(ty==='moving') p.x=laneX(movPos(row,gt));
  sfx('land'); arrive(r,p.lane,ty,0);
}
// inPlace: the floor vanished under the player; bounce: knocked off spikes
function startFall(lane,bounce,inPlace){
  p.riding=null; p.anim=null;
  p.state='fall'; p.fallLane=lane; p.fromRow=p.row; p.vy=bounce?-150:(inPlace?0:-80);
  p.checkRow=(bounce||inPlace)?p.row-1:p.row;
  falls++; sfx('fall'); vib(25); breakStreak();
}
function knock(){ sfx('spike'); shake(3,.2); puff(laneX(p.lane),rowY(p.row)-6,6,'#ff5a5a',40,80,.4); p.y=rowY(p.row); p.x=laneX(p.lane); startFall(p.lane,true,false); }
function land(j,ty){
  const drop=Math.max(0,p.fromRow-j);
  p.row=j; p.lane=p.fallLane; p.y=rowY(j);
  p.state='stun'; p.stunT=Math.min(1.1,.42+drop*.04);
  shake(Math.min(4,1+drop*.2),.22); sfx('land'); vib(40);
  puff(p.x,p.y,8,'#d9c9b8',40,90,.4);
  arrive(j,p.lane,ty,0);
}
function updatePlayer(dt){
  if(p.anim && p.state!=='fall'){
    const a=p.anim; a.t+=dt; const k=Math.min(1,a.t/a.dur);
    p.x=lerp(a.fx,a.tx,k); p.y=lerp(a.fy,a.ty,k)-Math.sin(k*Math.PI)*a.arc;
    if(p.state==='spring' && Math.random()<.6) parts.push({x:p.x,y:p.y,vx:rnd(-10,10),vy:rnd(5,20),g:0,life:.35,c:THEMES[themeAt(p.row)].acc,s:1});
    if(k>=1){ p.x=a.tx; p.y=a.ty; p.anim=null; if(p.state==='hop') p.state='idle'; else if(p.state==='spring') landSpring(); }
  }
  if(p.state==='launch' && gt>=p.launchAt && !p.anim) doLaunch();
  if(p.state==='fall'){
    p.x+=(laneX(p.fallLane)-p.x)*Math.min(1,dt*16);
    p.vy+=950*dt; p.y+=p.vy*dt;
    while(p.vy>0 && p.checkRow>=0 && p.y>=rowY(p.checkRow)){
      const j=p.checkRow;
      if(j===0){ p.y=0; land(0,'floor'); break; }
      const row=getRow(j), ty=landType(row,p.fallLane,gt);
      if(ty==='spike'){ p.y=rowY(j); p.row=j; sfx('spike'); puff(p.x,p.y,5,'#ff5a5a',30,60,.3); p.vy=-110; p.checkRow=j-1; break; }
      if(ty){ p.y=rowY(j); if(ty==='moving') p.x=laneX(movPos(row,gt)); land(j,ty); break; }
      p.checkRow--;
    }
  }
  if(p.state==='stun'){ p.stunT-=dt; if(p.stunT<=0) p.state='idle'; }
  if(p.riding && (p.state==='idle'||p.state==='stun') && !p.anim){
    const pos=movPos(p.riding,gt); p.x=laneX(pos); p.lane=clamp(Math.round(pos),0,LANES-1);
  }
  if((p.state==='idle'||p.state==='stun'||p.state==='hop'||p.state==='launch') && p.row>0 && !p.riding){
    const c=getRow(p.row).cells[p.lane];
    if(!c || c.broken || (c.t==='phase' && !phaseOn(c))){ if(p.anim) finishHop(); startFall(p.lane,false,true); }
  }
  if(p.state!=='dead' && state==='play' && p.y>-L*DY+1) die();
}
function updateRows(dt){
  const a=Math.max(1,p.row-30), b=Math.min(run.rows.length-1,p.row+30);
  for(let i=a;i<=b;i++){
    const row=run.rows[i];
    for(let l=0;l<LANES;l++){
      const c=row.cells[l]; if(!c) continue;
      if(c.sq>0) c.sq-=dt;
      if(c.until && !c.broken){
        if(Math.random()<.3) parts.push({x:laneX(l)+rnd(-10,10),y:rowY(i)+8,vx:0,vy:10,g:120,life:.4,c:THEMES[row.th].blk.d,s:1});
        if(gt>=c.until){
          c.broken=true; sfx('crumble');
          const k=THEMES[row.th].blk;
          for(let q=0;q<12;q++) parts.push({x:laneX(l)+rnd(-11,11),y:rowY(i)+rnd(1,7),vx:rnd(-25,25),vy:rnd(-30,10),g:300,life:rnd(.5,.9),c:q%2?k.b:k.d,s:2});
        }
      }
    }
  }
}
function die(){
  breakStreak();
  p.state='dead'; deadT=0; sfx('die'); vib([60,40,140]); shake(5,.45);
  for(let k=0;k<26;k++) parts.push({x:p.x+rnd(-4,4),y:p.y,vx:rnd(-45,45),vy:rnd(-110,-30),g:260,life:rnd(.5,1),c:k%3?'#ffc23a':'#fff2a8',s:k%4?1:2});
}

/* ================= particles ================= */
function puff(x,y,n,c,spd,g,life){ for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, v=Math.random()*spd; parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-spd*.4,g,life:life*(.6+Math.random()*.6),c,s:1}); } }
function updateParts(dt){
  for(let i=parts.length-1;i>=0;i--){ const q=parts[i]; q.vy+=q.g*dt; q.x+=q.vx*dt; q.y+=q.vy*dt; q.life-=dt; if(q.life<=0) parts.splice(i,1); }
  if(parts.length>500) parts.splice(0,parts.length-500);
}
function shake(a,t){ if(RM) return; shakeA=Math.max(shakeT>0?shakeA:0,a); shakeT=Math.max(shakeT,t); }
function vib(pattern){ if(!save.vib) return; try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){} }

/* ================= audio ================= */
const AU={ac:null,noise:null,out:null,mus:{next:0,step:0}};
function audioInit(){
  if(AU.ac){ if(AU.ac.state==='suspended') AU.ac.resume().catch(()=>{}); return; }
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
  try{
    const ac=new AC(); AU.ac=ac; AU.out=ac.createGain(); AU.out.gain.value=.9; AU.out.connect(ac.destination);
    const b=ac.createBuffer(1,ac.sampleRate,ac.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; AU.noise=b;
  }catch(e){ AU.ac=null; }
}
function tone(f,dur,type,vol,slide,when){
  const ac=AU.ac; if(!ac) return; const t=when||ac.currentTime;
  const o=ac.createOscillator(), g=ac.createGain(); o.type=type||'square';
  o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t+dur);
  g.gain.setValueAtTime(vol||.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(AU.out); o.start(t); o.stop(t+dur+.03);
}
function noise(dur,vol,freq,when){
  const ac=AU.ac; if(!ac||!AU.noise) return; const t=when||ac.currentTime;
  const s=ac.createBufferSource(); s.buffer=AU.noise; const f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=freq||1200;
  const g=ac.createGain(); g.gain.setValueAtTime(vol||.08,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f); f.connect(g); g.connect(AU.out); s.start(t,Math.random()*.5); s.stop(t+dur+.03);
}
const PENTA=[0,2,4,7,9];
const SFX={
  step:()=>tone(392*Math.pow(2,(PENTA[maxRow%5]+12*(Math.floor(maxRow/5)%2))/12),.06,'square',.04),
  ice:()=>tone(1400,.12,'triangle',.03,2200),

function musicTick(){
  const ac=AU.ac, M=AU.mus;
  if(!ac||!save.music||state!=='play'||paused||!started||p.state==='dead'){ M.next=0; return; }
  const bpm=108+Math.min(56,lavaSpeed*11), spb=60/bpm/4;
  if(M.next<ac.currentTime) M.next=ac.currentTime+.05;
  const root=ROOTS[themeAt(maxRow)];
  while(M.next<ac.currentTime+.15){
    const s=M.step, t=M.next;
    if(s%2===0) tone(mf(root+BASS[(s>>1)%16]),spb*1.7,'triangle',.08,0,t);
    if(s%8===0) tone(150,.12,'sine',.12,40,t);

  }
}

function darknessAmt(){
  const lv=Math.max(0,-(camY+H*.64)/DY), z=Math.floor(lv/ZLEN);
  if(!THEMES[zoneTheme(z)].dark) return 0;
  const pos=lv-z*ZLEN;
  return clamp(pos/6,0,1)*clamp((ZLEN-pos)/5,0,1);
}
function drawDarkness(){
  const a=darknessAmt()*(1-Math.min(1,flash*1.4));
  if(a<=.01) return;
  dctx.globalCompositeOperation='source-over'; dctx.clearRect(0,0,W,H);
  dctx.globalAlpha=1; dctx.fillStyle='rgba(6,4,16,'+(.95*a)+')'; dctx.fillRect(0,0,W,H);
  dctx.globalCompositeOperation='destination-out'; dctx.fillStyle='#000';
  const px=Math.round(p.x), py=Math.round(p.y-viewY-20);
  dctx.globalAlpha=.35; circ(dctx,px,py,58);
  dctx.globalAlpha=.6; circ(dctx,px,py,46);
  dctx.globalAlpha=1; circ(dctx,px,py,34);
  const surf=lavaSurf();
  dctx.globalAlpha=.55; dctx.fillRect(0,surf-16,W,H);
  dctx.globalAlpha=1; dctx.fillRect(0,surf-5,W,H);
  dctx.globalCompositeOperation='source-over'; dctx.globalAlpha=1;
  ctx.drawImage(dark,0,0);
}
function drawFlash(){
  if(flash<=0) return;
  if(flash>.55){ let x=boltX; for(let y=0;y<H*.55;y+=6){ R(x,y,1,6,'#e8fbff'); R(x+1,y,1,6,'#9fdcff'); x+=Math.round(hash(boltSeed,y)*8-4); } }
  ctx.globalAlpha=flash*.4; R(0,0,W,H,'#dff6ff'); ctx.globalAlpha=1;
}
function drawAmbient(){
  const id=THEMES[camTheme].id;
  if(id==='storm'){
    ctx.globalAlpha=.35;
    for(let i=0;i<36;i++){ const x=((hash(i,0)*W+gt*55*(1+hash(i,1)))%W)|0, y=((hash(i,2)*H+gt*230*(1+hash(i,3)*.5))%H)|0; R(x,y,1,3,'#aac0ff'); R(x-1,y+3,1,2,'#aac0ff'); }
    ctx.globalAlpha=1;
  } else if(id==='ice'){
    ctx.globalAlpha=.7;
    for(let i=0;i<28;i++){ const x=((hash(i,4)*W+Math.sin(gt+i)*6+W)%W)|0, y=((hash(i,5)*H+gt*18*(1+hash(i,6)))%H)|0; R(x,y,1,1,'#ffffff'); }
    ctx.globalAlpha=1;
  }
}
function drawVignette(){
  if(state!=='play'||p.state==='dead'||!started) return;
  const dist=p.row-L, d=clamp((4.5-dist)/4.5,0,1);
  if(d<=0) return;
  ctx.globalAlpha=d*(.28+.22*Math.sin(gt*12));
  R(0,0,W,3,'#ff3b1f'); R(0,H-3,W,3,'#ff3b1f'); R(0,0,3,H,'#ff3b1f'); R(W-3,0,3,H,'#ff3b1f');
  ctx.globalAlpha*=.5; R(3,3,W-6,3,'#ff3b1f'); R(3,H-6,W-6,3,'#ff3b1f'); R(3,6,3,H-12,'#ff3b1f'); R(W-6,6,3,H-12,'#ff3b1f');
  ctx.globalAlpha=1;
}
function render(){
  const sx = shakeT>0 ? Math.round((Math.random()*2-1)*shakeA) : 0;
  const sy = shakeT>0 ? Math.round((Math.random()*2-1)*shakeA) : 0;
  viewY=Math.round(camY)+sy;
  ctx.imageSmoothingEnabled=false;
  ctx.save(); ctx.translate(sx,0);
  drawBackground(); drawAmbient(); drawRows(); drawPlayer(); drawLava(); drawParts(); drawDarkness(); drawFlash();
  ctx.restore();
  drawVignette();
}

/* ================= update ================= */
function ambient(dt){
  const surf=-L*DY;
  if(surf-camY<H+20 && Math.random()<dt*14) parts.push({x:Math.random()*W,y:surf-2,vx:rnd(-6,6),vy:rnd(-45,-20),g:-8,life:rnd(.8,1.6),c:Math.random()<.5?'#ffc23a':'#ff7a1a',s:1});
  const id=THEMES[camTheme].id;
  if(id==='forest' && Math.random()<dt*7) parts.push({x:Math.random()*W,y:camY+H*rnd(.2,1),vx:rnd(-4,4),vy:rnd(-12,-5),g:0,life:rnd(2,3.5),c:'#c6ff9a',s:1});
  if(id==='cave' && Math.random()<dt*3) parts.push({x:Math.random()*W,y:camY,vx:0,vy:20,g:40,life:2,c:'#5a3a38',s:1});
}
function update(dt){
  gt+=dt;
  getRow(p.row+60);
  if(state==='play'){
    if(started && p.state!=='dead'){
      runT+=dt; lavaSpeed=lavaSpeedAt(runT); L+=lavaSpeed*dt;
      const g=lavaGap(runT); if(L<p.row-g) L=p.row-g;
    }
    updatePlayer(dt); updateRows(dt); updateFire(dt);
    if(p.state==='dead'){ deadT+=dt; if(deadT>1.1 && !overShown) gameOver(); }
    if(!save.tut && maxRow>=15){ save.tut=true; persist(); }
    if(darknessAmt()>.2 && p.state!=='dead'){ nextBolt-=dt; if(nextBolt<=0){ flash=1; nextBolt=rnd(2.2,4); boltX=(Math.random()*(W-20)+10)|0; boltSeed=(Math.random()*1e6)|0; sfx('thunder'); } }
  }
  ambient(dt);
  updateParts(dt);
  const tgtY=p.y-H*.64;
  camY+=(tgtY-camY)*Math.min(1,dt*(p.state==='fall'?16:9));
  if(shakeT>0){ shakeT-=dt; if(shakeT<=0) shakeA=0; }
  flash=Math.max(0,flash-dt*2.2);
  updateHUD();
}

function updateFire(dt){
  if(streak && gt-lastHop>FIRE_GAP+.2 && p.state!=='launch' && p.state!=='spring') breakStreak();
  const lvl = streak>=FIRE_HOT ? 2 : streak>=FIRE_ON ? 1 : 0;
  if(lvl>fireLvl){ sfx(lvl===2?'blaze':'ignite'); if(lvl===2) vib(15); }
  fireLvl=lvl;
  const target = lvl===2 ? 1 : lvl===1 ? .6 : 0;
  fire += (target-fire)*Math.min(1,dt*(target>fire?14:5));
  if(fire>.08 && p.state!=='dead' && Math.random()<dt*(18+fire*30)){
    parts.push({x:p.x+rnd(-4,4),y:p.y-rnd(2,10),vx:rnd(-8,8),vy:rnd(-40,-18),g:-10,life:rnd(.25,.5),c:Math.random()<.5?'#ffc23a':(fire>.8?'#fff2a8':'#ff7a1a'),s:1});
  }
}
function drawFire(x,y){
  if(fire<.06) return;
  const h=fire, f=(gt*14)|0;
  // soft round glow, then flame tongues licking up the climber's sides and over the head (sprite is 10x14 at x,y)
  ctx.globalAlpha=.16*h; circ(ctx,x+5,y+8,Math.round(7+3*h),'#ff7a1a'); ctx.globalAlpha=1;
  const tongue=(cx,base,len)=>{
    if(len<=0) return;
    R(cx,base-len,1,len,'#e2361c');
    if(len>1) R(cx,base-len+1,1,len-1,'#ff7a1a');
    if(len>3) R(cx,base-Math.ceil(len*.55),1,Math.ceil(len*.55),'#ffc23a');
    if(h>.8 && len>5) R(cx,base-Math.ceil(len*.25),1,Math.ceil(len*.25),'#fff2a8');
  };
  const side=[[-2,6],[-1,9],[10,9],[11,6]];
  side.forEach(([dx,m],i)=>tongue(x+dx,y+13,Math.round((m*.55+hash(i,f)*m*.6)*h)));
  for(let i=0;i<6;i++){
    const m=(i===2||i===3)?7:5;
    tongue(x+2+i,y+1,Math.round((1+hash(i+9,f)*m)*h));
  }
}

/* ================= HUD / screens ================= */
const hud=$('hud'), hH=$('hH'), hBest=$('hBest'), hCoins=$('hCoins'), meter=$('meter'), meterFill=$('meterFill'), meterNum=$('meterNum');
const pads=[$('pad0'),$('pad1'),$('pad2')], tut=$('tut');
const shown={h:-1,c:-1,d:-1,f:-1,hot:null,hint:undefined,fire:null};
function updateHUD(){
  if(state!=='play') return;
  if(shown.h!==maxRow){ shown.h=maxRow; hH.textContent=maxRow; hH.classList.remove('bump'); void hH.offsetWidth; hH.classList.add('bump'); hBest.textContent=Math.max(save.best,maxRow); }
  if(shown.c!==coinsRun){ shown.c=coinsRun; hCoins.textContent=coinsRun; }
  const dist=Math.max(0,Math.floor(p.row-L));
  if(shown.d!==dist){ shown.d=dist; meterNum.textContent=dist; }
  const f=Math.round(clamp(1-(p.row-L-.5)/9,0,1)*100);
  if(shown.f!==f){ shown.f=f; meterFill.style.width=f+'%'; }
  const hot=dist<4 && started;
  if(shown.hot!==hot){ shown.hot=hot; meter.classList.toggle('hot',hot); }
  const burning=fireLvl>0;
  if(shown.fire!==burning){ shown.fire=burning; hH.classList.toggle('fire',burning); }
  const hint = (!save.tut && p.state==='idle') ? hintDx() : null;
  if(shown.hint!==hint){ shown.hint=hint; pads.forEach((el,i)=>el.classList.toggle('hint',hint!=null && hint===i-1)); tut.hidden=hint==null; }
}
// slim zone toast under the HUD; the hazard tip shows only the first time a player ever reaches that zone
function showZone(z){
  const th=zoneTheme(z), T=THEMES[th], b=$('zone'), tip=$('zTip');
  if(!Array.isArray(save.seen)) save.seen=[];
  const first = T.tip && !save.seen.includes(th);
  if(first){ save.seen.push(th); persist(); }
  $('zNo').textContent=z+1; $('zKr').textContent=zoneName(z);
  tip.textContent=first?T.tip:''; tip.hidden=!first;
  b.classList.remove('show','tip'); void b.offsetWidth; b.classList.add('show'); if(first) b.classList.add('tip');
}
function applyToggles(){
  for(const [id,k] of [['tSfx','sfx'],['tMusic','music'],['tVib','vib']]){ const b=$(id); b.setAttribute('aria-pressed',!!save[k]); b.textContent=save[k]?'켬':'끔'; }
}
function updateTitle(){ $('tBest').textContent=save.best; $('tCoins').textContent=save.coins; }
const screens=['scrTitle','scrPause','scrOver','scrSkins','scrSet'];
function startGame(){
  audioInit(); sfx('ui');
  resetWorld(); state='play'; paused=false;
  screens.forEach(s=>$(s).hidden=true);
  hud.hidden=false; shown.h=shown.c=shown.d=shown.f=-1; shown.hot=null; shown.hint=undefined; shown.fire=null;
  $('zone').classList.remove('show','tip'); armBack();
}
// Android back button in the installed app: pause the run instead of closing the app
const INSTALLED = !!(window.matchMedia && matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches);
let backArmed=false, ignorePop=false;
function armBack(){ if(!INSTALLED||backArmed) return; try{ history.pushState({lava:1},''); backArmed=true; }catch(e){} }
function disarmBack(){ if(!backArmed) return; backArmed=false; ignorePop=true; try{ history.back(); }catch(e){ ignorePop=false; } }
addEventListener('popstate',()=>{
  if(ignorePop){ ignorePop=false; return; }
  backArmed=false;
  if(state==='play'){ pause(); armBack(); }
  else if(state==='over'){ toTitle(); }
});
function toTitle(){
  disarmBack();
  state='title'; paused=false; resetWorld();
  screens.forEach(s=>$(s).hidden=true); hud.hidden=true; $('scrTitle').hidden=false; updateTitle();
}
function pause(){ if(state!=='play'||paused||p.state==='dead') return; paused=true; $('scrPause').hidden=false; }
function resume(){ paused=false; $('scrPause').hidden=true; last=performance.now(); }
let overReady=false;
function gameOver(){
  overShown=true; state='over';
  const isNew=maxRow>save.best;
  if(isNew) save.best=maxRow;
  save.coins+=coinsRun; persist();
  $('oH').textContent=maxRow; $('oNew').hidden=!isNew; $('oBest').textContent=save.best;
  $('oZone').textContent=zoneName(Math.floor(maxRow/ZLEN)); $('oCoins').textContent='+'+coinsRun; $('oFalls').textContent=falls;
  hud.hidden=true; $('scrOver').hidden=false;
  overReady=false; $('btnRetry').disabled=true; $('btnMenu').disabled=true;
  setTimeout(()=>{ overReady=true; $('btnRetry').disabled=false; $('btnMenu').disabled=false; },650);
}
function renderSkins(){
  const grid=$('skinGrid'); grid.innerHTML=''; $('sCoins').textContent=save.coins;
  SKINS.forEach(sk=>{
    const owned=save.owned.includes(sk.id), sel=save.skin===sk.id;
    const b=document.createElement('button'); b.className='skin'+(sel?' sel':'')+(owned?'':' locked'); b.id='skin-'+sk.id;
    const c=document.createElement('canvas'); c.width=10; c.height=14; c.getContext('2d').drawImage(SPR[sk.id].stand[0],0,0);
    const n=document.createElement('span'); n.className='skin-name'; n.textContent=sk.name;
    const st=document.createElement('span'); st.className='skin-state'; st.textContent=sel?'사용 중':owned?'선택':sk.cost+' 코인';
    b.append(c,n,st);
    b.addEventListener('click',()=>{
      audioInit();
      if(owned){ save.skin=sk.id; sfx('ui'); }
      else if(save.coins>=sk.cost){ save.coins-=sk.cost; save.owned.push(sk.id); save.skin=sk.id; sfx('coin'); }
      else { st.textContent='코인 부족'; sfx('deny'); return; }
      persist(); renderSkins(); updateTitle();
    });
    grid.appendChild(b);
  });
}

/* ================= input: left / middle / right third ================= */
function press(dx){
  audioInit();
  act(dx);
  const el=pads[dx+1]; el.classList.add('down'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('down'),80);
}
stage.addEventListener('pointerdown',e=>{
  if(e.target.closest('button')||e.target.closest('.screen')) return;
  e.preventDefault();
  if(state!=='play'||paused) return;
  const r=stage.getBoundingClientRect(), f=(e.clientX-r.left)/r.width;
  press(f<1/3?-1:f>2/3?1:0);
});
stage.addEventListener('contextmenu',e=>e.preventDefault());
$('scrTitle').addEventListener('pointerdown',e=>{ if(e.target.closest('button')) return; e.preventDefault(); startGame(); });
addEventListener('keydown',e=>{
  if(e.repeat) return;
  const k=e.key;
  if(state==='title' && $('scrSkins').hidden && $('scrSet').hidden && (k===' '||k==='Enter')){ e.preventDefault(); startGame(); return; }
  if(state==='over' && overReady && (k===' '||k==='Enter')){ e.preventDefault(); startGame(); return; }
  if(state!=='play') return;
  if(k==='Escape'||k==='p'||k==='P'){ paused?resume():pause(); return; }
  if(paused) return;
  let dx=null;
  if(['ArrowLeft','a','A','q','Q'].includes(k)) dx=-1;
  else if(['ArrowUp','w','W',' ','s','S'].includes(k)) dx=0;
  else if(['ArrowRight','d','D','e','E'].includes(k)) dx=1;
  if(dx!==null){ e.preventDefault(); press(dx); }
});
$('btnPause').addEventListener('click',()=>{ sfx('ui'); pause(); });
$('btnResume').addEventListener('click',()=>{ sfx('ui'); resume(); });
$('btnQuit').addEventListener('click',()=>{ sfx('ui'); toTitle(); });
$('btnRetry').addEventListener('click',()=>{ if(overReady) startGame(); });
$('btnMenu').addEventListener('click',()=>{ if(overReady){ sfx('ui'); toTitle(); } });
$('btnSkins').addEventListener('click',()=>{ audioInit(); sfx('ui'); renderSkins(); $('scrSkins').hidden=false; });
$('btnSkinsBack').addEventListener('click',()=>{ sfx('ui'); $('scrSkins').hidden=true; });
$('btnSet').addEventListener('click',()=>{ audioInit(); sfx('ui'); $('scrSet').hidden=false; });
$('btnSetBack').addEventListener('click',()=>{ sfx('ui'); $('scrSet').hidden=true; });
for(const [id,k] of [['tSfx','sfx'],['tMusic','music'],['tVib','vib']]) $(id).addEventListener('click',()=>{ save[k]=!save[k]; persist(); applyToggles(); sfx('ui'); if(k==='vib') vib(30); });
document.addEventListener('visibilitychange',()=>{ if(document.hidden) pause(); });
addEventListener('blur',()=>pause());

/* ================= sizing & loop ================= */
function resize(){
  const aw=app.clientWidth, ah=app.clientHeight; if(!aw||!ah) return;
  const nh=Math.round(W*clamp(ah/aw,16/9,2.3));
  if(nh!==H||cv.height!==nh){ H=nh; cv.width=W; cv.height=H; dark.width=W; dark.height=H; }
  let fw=aw, fh=aw*H/W; if(fh>ah){ fh=ah; fw=ah*W/H; }
  stage.style.width=Math.floor(fw)+'px'; stage.style.height=Math.floor(fh)+'px';
  stage.style.setProperty('--u',(fw/100)+'px');
}
addEventListener('resize',resize);
if(window.ResizeObserver) new ResizeObserver(resize).observe(app);

let last=performance.now();
function loop(now){
  let dt=(now-last)/1000; last=now; if(dt>.05) dt=.05; if(dt<0) dt=0;
  if(!paused) update(dt);
  render(); musicTick();
  requestAnimationFrame(loop);
}
resize(); applyToggles(); updateTitle(); resetWorld();
requestAnimationFrame(loop);
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
